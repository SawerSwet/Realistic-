[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=UltraStats
Author=Win81 UltraTune
Information=CPU / RAM / disk widget, Win11 style
Version=1.0

[Variables]
Font=Segoe UI
White=240,240,255,235
BarBg=255,255,255,40
BarFg=175,155,255,255

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=60

[MeasureDiskUsed]
Measure=Calc
Formula=(1 - MeasureDisk)

[MeterBG]
Meter=Image
W=190
H=122
SolidColor=25,20,40,150

[MeterCPULabel]
Meter=String
X=12
Y=8
FontFace=#Font#
FontSize=11
FontColor=#White#
Text=CPU
AntiAlias=1

[MeterCPUVal]
Meter=String
MeasureName=MeasureCPU
Percentual=1
X=150
Y=8
FontFace=#Font#
FontSize=11
FontColor=#White#
AntiAlias=1

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=12
Y=30
W=160
H=6
BarColor=#BarFg#
SolidColor=#BarBg#

[MeterRAMLabel]
Meter=String
X=12
Y=48
FontFace=#Font#
FontSize=11
FontColor=#White#
Text=RAM
AntiAlias=1

[MeterRAMVal]
Meter=String
MeasureName=MeasureRAM
Percentual=1
X=150
Y=48
FontFace=#Font#
FontSize=11
FontColor=#White#
AntiAlias=1

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=12
Y=70
W=160
H=6
BarColor=#BarFg#
SolidColor=#BarBg#

[MeterSSDLabel]
Meter=String
X=12
Y=88
FontFace=#Font#
FontSize=11
FontColor=#White#
Text=SSD
AntiAlias=1

[MeterSSDVal]
Meter=String
MeasureName=MeasureDiskUsed
Percentual=1
X=150
Y=88
FontFace=#Font#
FontSize=11
FontColor=#White#
AntiAlias=1

[MeterSSDBar]
Meter=Bar
MeasureName=MeasureDiskUsed
X=12
Y=110
W=160
H=6
BarColor=#BarFg#
SolidColor=#BarBg#
