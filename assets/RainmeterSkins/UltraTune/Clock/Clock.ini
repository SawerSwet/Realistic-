[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=UltraClock
Author=Win81 UltraTune
Information=Win11-style clock widget
Version=1.0

[Variables]
Font=Segoe UI
White=240,240,255,235
Purple=175,155,255,255

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %d %B

[MeterBG]
Meter=Image
W=210
H=92
SolidColor=25,20,40,150

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=12
Y=6
FontFace=#Font#
FontSize=30
FontColor=#White#
StringAlign=Left
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=12
Y=52
FontFace=#Font#
FontSize=11
FontColor=#Purple#
AntiAlias=1
