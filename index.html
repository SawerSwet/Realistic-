<canvas id="c"></canvas>

<script>
const FS=`#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes, uWind;
uniform sampler2D uSand, uPeb, uGrass, uRock;
uniform float uTime;
uniform vec3 uCam, uF, uR, uU, uSun;
out vec4 oc;
const mat2 R2=mat2(.8, .6, -.6, .8);
float dayf, sunE;
vec3 L, sunCol, ambCol, horC, zenC;
float gS, gTint, gTT;
vec2 gD;
bool gLeaf;
bool gReal; // true only when treeD returned a real tree distance, not a cell/bounding-box step bound
// mip level for a texture tiled sc times per unit, from distance and render resolution
float lodFor(float t, float sc) {
  return max(0., log2(t*.0016*(1080./uRes.y)*256.*sc));
}

float ss(float a, float b, float x) {
  float t=clamp((x-a)/(b-a), 0., 1.);
  return t*t*(3.-2.*t);
}

float hs(ivec2 p) {
  uint h=uint(p.x)*374761393u+uint(p.y)*668265263u;
  h=(h^(h>>13))*1274126177u;
  h^=h>>16;
  return float(h)/4294967295.;
}

float nz(vec2 p) {
  vec2 i=floor(p), f=p-i;
  f=f*f*f*(f*(f*6.-15.)+10.);
  ivec2 j=ivec2(i);
  return mix(mix(hs(j), hs(j+ivec2(1, 0)), f.x), mix(hs(j+ivec2(0, 1)), hs(j+ivec2(1, 1)), f.x), f.y);
}

float fbm(vec2 p) {
  float a=.5, s=0.;
  for(int i=0; i<5; i++) {
    s+=a*nz(p);
    p=R2*p*2.02;
    a*=.5;
  }
  return s;
}

float H(vec2 p) {
  vec2 q=p*.0045;
  float a=.5, h=0.;
  for(int i=0; i<4; i++) {
    h+=a*nz(q);
    q=R2*q*2.03;
    a*=.5;
  }
  h=(h-.469)*80.+7.;
  float r=abs(nz(p*.0025+vec2(31., 7.))-.5);
  float rw=(1.-ss(0., .035, r))*(1.-ss(8., 22., h));
  return min(h, mix(h, -3., rw));
}

// ---- grass
bool grassIn(vec2 xz, float hh, float g, float t) {
  float gm=ss(1., 2.4, g)*(1.-ss(28., 44., g))*(1.-ss(20., 55., t));
  if(gm<.03)return false;
  float gust=nz(xz*.07-uWind*uTime*1.6);
  vec2 off=uWind*(.15+.85*gust)*hh*.55+.05*hh*vec2(sin(uTime*2.3+xz.y*.9), cos(uTime*2.+xz.x*.8));
  int layers=t<14.?3:(t<32.?2:1); // fewer grass layers with distance
  for(int k=0; k<3; k++) {
    if(k>=layers)break;
    vec2 q=(xz+off)*(k==0?2.6:(k==1?3.3:4.1))+(k==0?vec2(0.):(k==1?vec2(2.59, 4.27):vec2(5.1, 1.7)));
    vec2 id=floor(q), f=q-id;
    ivec2 ii=ivec2(id)+ivec2(k*101, k*53);
    vec2 c=vec2(.28)+.44*vec2(hs(ii), hs(ii+ivec2(57, 113)));
    float h3=hs(ii+ivec2(7, 5));
    float th=(.5+.65*h3)*gm;
    if(hh>=th)continue;
    float s=hh/th;
    vec2 d=f-c;
    float rad=.5*pow(1.-s, .8)*(.72+.28*sin(atan(d.y, d.x)*5.+h3*40.));
    if(length(d)<rad) {
      gS=s;
      gD=d;
      gTint=h3;
      return true;
    }
  }
  return false;
}

// ---- trees
float sdCap(vec3 p, vec3 a, vec3 b, float r) {
  vec3 pa=p-a, ba=b-a;
  float h=clamp(dot(pa, ba)/dot(ba, ba), 0., 1.);
  return length(pa-ba*h)-r;
}

float smin(float a, float b, float k) {
  float h=max(k-abs(a-b), 0.)/k;
  return min(a, b)-h*h*k*.25;
}

float treeD(vec3 p) {
  gReal=false;
  vec2 id=floor(p.xz/16.);
  ivec2 ii=ivec2(id);
  vec2 fr=p.xz/16.-id;
  vec2 ed=min(fr, 1.-fr)*16.;
  float de=min(ed.x, ed.y)+1.;
  float dens=ss(.3, .62, nz(id*.28+3.7));
  if(hs(ii+ivec2(3, 71))>dens*.85+.04)return de;
  vec2 c=(id+.5+(vec2(hs(ii+ivec2(5, 9)), hs(ii+ivec2(13, 2)))-.5)*.3)*16.;
  float ty=H(c);
  if(ty<2.3||ty>36.)return de;
  float s=.75+.45*hs(ii+ivec2(21, 8));
  vec3 q=p-vec3(c.x, ty, c.y);
  float bd=max(length(q.xz)-5.5*s, max(-q.y-1., q.y-11.*s));
  if(bd>1.5)return min(bd, de);
  float hf=clamp(q.y/(9.*s), 0., 1.);
  q.xz-=(uWind*.9+.2*vec2(sin(uTime*1.3+c.x), cos(uTime*1.1+c.y)))*hf*hf*.9;
  float tr=.26*s*(1.-.55*clamp(q.y/(5.5*s), 0., 1.));
  float dT=max(length(q.xz)-tr, max(-q.y, q.y-6.*s));
  float ca=hs(ii+ivec2(2, 2))*6.283;
  vec3 o1=vec3(cos(ca), 0., sin(ca))*.9*s, o2=vec3(cos(ca+2.1), .5, sin(ca+2.1))*.9*s, o3=vec3(cos(ca+4.2), -.2, sin(ca+4.2))*.9*s;
  vec3 cc=vec3(0., 6.*s, 0.);
  float dc=smin(smin(length(q-cc-o1), length(q-cc-o2), 1.), length(q-cc-o3), 1.)-2.3*s;
  float tdist=length(p-uCam);
  if(tdist<160.)dc+=.35*s*sin(q.x*2.1+q.y*1.7+uTime*1.1)*sin(q.z*2.3-q.y*1.4+uTime*.9);
  if(tdist<70.)dc+=.12*sin(q.x*5.3+q.z*4.7+q.y*3.9);
  float dB=min(sdCap(q, vec3(0, 3.5*s, 0), cc+o1*.6, .1*s), min(sdCap(q, vec3(0, 4.3*s, 0), cc+o2*.6, .09*s), sdCap(q, vec3(0, 3.2*s, 0), cc+o3*.6, .08*s)));
  dT=min(dT, dB);
  gLeaf=dc*.7<dT;
  gReal=true;
  gTT=hs(ii+ivec2(40, 60));
  return min(min(dT, dc*.7), de);
}

float shadow(vec3 p, vec3 l) {
  float r=1., t=.2+.1*hs(ivec2(gl_FragCoord.xy));
  for(int i=0; i<18; i++) {
    vec3 q=p+l*t;
    float hh=q.y-H(q.xz);
    if(hh>45.)break;
    float d=hh;
    float sd=d;
    if(hh<17.) {
      float td=treeD(q);
      sd=min(d, td);
      if(gReal)d=sd;
    }
    r=min(r, 7.*d/t);
    if(r<.01||t>160.)break;
    t+=clamp(sd, .35, 9.);
  }
  return ss(0., 1., r);
}

// ---- sky
vec3 skyBase(vec3 rd) {
  float e=max(rd.y, 0.);
  vec3 c=mix(horC, zenC, pow(e, .5));
  float sd=max(dot(rd, uSun), 0.);
  c+=sunCol*(.05*pow(sd, 4.)+.12*pow(sd, 40.));
  return c;
}

vec4 clouds(vec3 rd) {
  if(rd.y<.01)return vec4(0, 0, 0, 1);
  vec3 acc=vec3(0);
  float tr=1.;
  float sd=max(dot(rd, uSun), 0.);
  vec2 sdir=uSun.xz/max(uSun.y, .25)*.035;
  for(int l=0; l<2; l++) {
    float fl=float(l);
    float t=(750.+fl*450.-uCam.y)/rd.y;
    vec2 uv=(uCam.xz+rd.xz*t)*.00065+vec2(.7, .3)*uTime*.012*(1.+fl*.5)+fl*17.3;
    float cd=fbm(uv), c2=fbm(uv+sdir);
    float d=ss(.48, .66, cd);
    float a=d*ss(.01, .14, rd.y);
    float sh=clamp(.55+(cd-c2)*10., 0., 1.);
    vec3 lit=sunCol*.34+ambCol*.9, dk=ambCol*.5+.01;
    vec3 cc=mix(dk, lit, sh)+sunCol*.3*pow(sd, 6.)*(1.-d);
    acc+=tr*a*cc;
    tr*=1.-a;
  }
  return vec4(acc, tr);
}

vec3 sky(vec3 rd) {
  vec3 c=skyBase(rd);
  float nt=1.-dayf;
  if(rd.y>0.) {
    if(nt>.05) {
      vec2 sp=rd.xz/(rd.y+.2)*140.;
      float st=hs(ivec2(floor(sp)));
      c+=vec3(.85, .9, 1.)*step(.995, st)*nt*.8*(.7+.3*sin(uTime*3.+st*100.));
      c+=vec3(.8, .85, .95)*.9*ss(.9993, .9996, dot(rd, -uSun))*nt;
    }
    c+=sunCol*.6*ss(.9996, .99985, dot(rd, uSun));
  }
  vec4 cl=clouds(rd);
  return c*cl.a+cl.rgb;
}

// ---- water
float wv(vec2 q) {
  float t=uTime;
  return .18*sin(dot(q, vec2(.31, .21))+t*1.1)+.12*sin(dot(q, vec2(-.22, .41))+t*1.4)+.07*sin(dot(q, vec2(.9, -.5))+t*2.1)+.04*sin(dot(q, vec2(-.7, -1.1))+t*2.7)+.1*nz(q*.9+vec2(t*.5, t*.3))+.03*nz(q*3.+vec2(t*.8, -t*.6))+.015*nz(q*7.-vec2(t, t*.7));
}

vec3 water(vec3 p, vec3 rd, float t) {
  vec2 q=p.xz;
  float e=.12;
  float h0=wv(q);
  vec3 n=normalize(vec3((h0-wv(q+vec2(e, 0)))/e*2.2, 1., (h0-wv(q+vec2(0, e)))/e*2.2));
  n=normalize(mix(n, vec3(0, 1, 0), ss(60., 500., t)));
  vec3 rf=reflect(rd, n);
  rf.y=abs(rf.y)+.01;
  rf=normalize(rf);
  vec3 sk=sky(rf);
  float fr=.02+.98*pow(1.-max(dot(n, -rd), 0.), 5.);
  float dep=max(0., -H(q));
  vec3 lw=ambCol*1.4+sunCol*max(L.y, 0.)*.25;
  vec3 body=mix(vec3(.8, .7, .5)*lw, vec3(.02, .2, .3)*lw, 1.-exp(-dep*.5));
  body=mix(body, vec3(.03, .65, .6)*lw*1.3, .55*exp(-abs(dep-1.2)*.6)*(1.-exp(-dep*3.)));
  float sd=max(dot(rf, L), 0.);
  vec3 col=mix(body, sk, fr)+sunCol*(pow(sd, 700.)*14.+pow(sd, 60.)*.4);
  float fb=ss(.9, 0., dep+.12*sin(uTime*1.2+nz(q*.7)*6.));
  float fn=nz(q*2.5+uTime*.3)*.6+nz(q*7.-uTime*.2)*.4;
  float foam=fb*ss(.35, .75, fn+fb*.45)+fb*ss(.85, 1., sin(dep*7.-uTime*1.6))*.5;
  col=mix(col, (sunCol*.3+ambCol*1.3)*.9, clamp(foam, 0., 1.)*.9);
  return col;
}

void main() {
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 rd=normalize(uF*1.3+uR*uv.x+uU*uv.y), ro=uCam;
  sunE=uSun.y;
  dayf=ss(-.08, .25, sunE);
  float moon=ss(-.08, -.25, sunE)*.22;
  L=sunE>-.08?uSun:-uSun;
  sunCol=mix(vec3(1., .4, .12), vec3(1., .93, .82), ss(0., .45, sunE))*3.*dayf+vec3(.55, .7, 1.)*moon;
  ambCol=mix(vec3(.012, .018, .04), vec3(.3, .42, .68), dayf);
  horC=mix(mix(vec3(.01, .015, .035), vec3(1., .5, .28), ss(-.12, 0., sunE)), vec3(.68, .82, .95), ss(0., .4, sunE));
  zenC=mix(vec3(.004, .008, .025), mix(vec3(.1, .14, .3), vec3(.01, .08, .62), ss(0., .4, sunE)), ss(-.15, .05, sunE));
  float tw=rd.y<-.0005?-ro.y/rd.y:1e9;
  float tmax=750.;
  float t=.05+.05*hs(ivec2(gl_FragCoord.xy));
  int hit=-1;
  for(int i=0; i<130; i++) {
    if(t>=tw) {
      hit=4;
      t=tw;
      break;
    }
    if(t>tmax)break;
    vec3 p=ro+rd*t;
    float g=H(p.xz);
    float hh=p.y-g;
    float lim=t<55.?hh-1.25:hh;
    float dt=max(lim, 0.)*.5;
    if(hh<17.&&t<500.) {
      float td=treeD(p);
      if(td<.03+.0007*t) {
        hit=gLeaf?3:2;
        break;
      }
      dt=min(dt, td*.8);
    }
    if(hh>0.&&hh<1.3&&t<55.) {
      if(grassIn(p.xz, hh, g, t)) {
        hit=1;
        break;
      }
      dt=min(dt, .05+.01*t);
    }
    if(hh<.004*t+.01) {
      hit=0;
      break;
    }
    t+=max(dt, .03+.0012*t);
  }
  if(hit<0&&t<tmax*.9)hit=0;
  vec3 p=ro+rd*t, col;
  if(hit<0) {
    col=sky(vec3(rd.x, max(rd.y, 0.), rd.z));
  }   else {
    if(hit==4) {
      col=water(p, rd, t);
    }    else {
      vec3 n, alb;
      float ao=1., w=0., bl=0.;
      float g=H(p.xz);
      if(hit<=1) {
        float e=.08+.002*t;
        n=normalize(vec3(H(p.xz-vec2(e, 0))-H(p.xz+vec2(e, 0)), 2.*e, H(p.xz-vec2(0, e))-H(p.xz+vec2(0, e))));
        float sand=1.-ss(1.2, 2.6, g+(nz(p.xz*.3)-.5)*1.2);
        float rp=g*12.+nz(p.xz*.5)*6.;
        float rip=sin(rp);
        n=normalize(n+vec3(normalize(n.xz+1e-4).x, 0., normalize(n.xz+1e-4).y)*cos(rp)*.1*sand);
        float rock=1.-ss(.62, .8, n.y);
        vec3 gc=mix(vec3(.05, .15, .03), vec3(.16, .32, .06), nz(p.xz*.04))*(.8+.4*nz(p.xz*.5));
        gc=mix(gc, textureLod(uGrass, p.xz*.25, lodFor(t, .25)).rgb*.85, .45);
        float dry=ss(.55, .8, nz(p.xz*.012+4.));
        gc=mix(gc, vec3(.3, .28, .1), .5*dry);
        vec3 sc=mix(vec3(.74, .62, .4), textureLod(uSand, p.xz*.35, lodFor(t, .35)).rgb*vec3(1., .93, .78), .75)*(.9+.1*rip)*mix(.5, 1., ss(.1, .9, g));
        vec3 rc=mix(vec3(.32, .27, .22), vec3(.55, .36, .2), ss(.3, .7, nz(vec2(p.x*.03+p.z*.03, g*.35))))*(.6+.7*nz(p.xz*.25+g*.5))*(.85+.3*sin(g*2.5+nz(p.xz*.1)*4.));
        rc=mix(rc, textureLod(uRock, vec2(p.x+p.z, p.y)*.1, lodFor(t, .1)).rgb*1.1, .65);
        alb=mix(mix(gc, rc, rock), sc, sand*(1.-rock));
        // fine detail, faded with distance to avoid shimmering
        float lod=1.-ss(30., 140., t);
        n=normalize(n+rock*lod*vec3(nz(p.xz*2.+7.)-.5, 0., nz(p.xz*2.)-.5)*.9);
        float grain=nz(p.xz*14.)*.5+nz(p.xz*40.)*.5;
        alb*=1.+(grain-.5)*.35*lod*(sand+rock);
        vec2 pcell=floor(p.xz*8.);
        float ph=hs(ivec2(pcell));
        vec3 pebC=textureLod(uPeb, p.xz*.5, lodFor(t, .5)).rgb*(.8+.4*ph);
        float pebW=sand*ss(.45,.7,nz(p.xz*.8+3.))*(1.-ss(.9,2.,g))*lod;
        alb=mix(alb, pebC, pebW*.85);
        if(hit==1) {
          float gw=nz(p.xz*.05-uWind*uTime*1.2);
          alb=mix(vec3(.01, .07, .01), vec3(.3, .62, .06)*(.8+.5*gTint), pow(gS, .8))*(.55+.9*gw);
          alb=mix(alb, vec3(.75, .8, .15)*gS*gS, .35*ss(.6, .9, gw));
          alb=mix(alb, alb*vec3(1.6, 1.3, .6), .5*dry);
          ao=.25+.75*gS;
        alb*=.6+.8*dot(textureLod(uGrass, p.xz*1.2, lodFor(t, 1.2)).rgb, vec3(.333));
          n=normalize(mix(n, normalize(vec3(gD.x*1.6, 1., gD.y*1.6)), .65));
          w=.35;
          bl=gS;
        }
      } else {
        float e=.06+.002*t;
        vec2 k=vec2(1, -1)*e;
        n=normalize(k.xyy*treeD(p+k.xyy)+k.yyx*treeD(p+k.yyx)+k.yxy*treeD(p+k.yxy)+k.xxx*treeD(p+k.xxx));
        treeD(p);
        if(gLeaf) {
          vec3 lc=mix(vec3(.06, .18, .03), vec3(.22, .38, .06), gTT);
          lc=mix(lc, vec3(.6, .4, .06), step(.84, gTT));
          alb=lc*(.65+.7*nz(p.xz*2.5+p.y*1.7));
          ao=.4+.6*ss(-.8, .8, n.y);
          w=.35;
          bl=1.;
        } else {
          alb=vec3(.2, .14, .09)*(.7+.6*nz(vec2(p.y*3., p.x+p.z)*1.5));
          ao=.7;
        }
      }
      float ndl=clamp((dot(n, L)+w)/(1.+w), 0., 1.);
      float sh=1.;
      if(sunCol.x+sunCol.y>.01&&t<350.)sh=shadow(p+n*.1, L);
      col=alb*(sunCol*ndl*sh+ambCol*(.55+.45*n.y)*ao);
      col+=alb*sunCol*sh*pow(max(dot(rd, L), 0.), 4.)*.25*bl;
    }
    float f=1.-exp(-pow(t/450., 1.6));
    col=mix(col, skyBase(normalize(vec3(rd.x, min(rd.y, .12), rd.z))), f);
  }
  col*=1.15;
  col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);
  float lm=dot(col, vec3(.299, .587, .114));
  col=mix(vec3(lm), col, 1.3);
  col*=mix(vec3(.94, 1., 1.08), vec3(1.07, 1., .9), ss(.15, .65, lm));
  vec2 vq=gl_FragCoord.xy/uRes-.5;
  col*=1.-dot(vq, vq)*.85;
  col=pow(clamp(col, 0., 1.), vec3(.4545));
  col+=(hs(ivec2(gl_FragCoord.xy)+ivec2(int(uTime*30.))*37)-.5)/70.;
  oc=vec4(col, 1.);
}

`;
const VS=`#version 300 es
void main() {
  vec2 p=vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position=vec4(p*2.-1., 0., 1.);
}

`;
// ---- JS-side terrain (mirrors the shader) so the camera never dives into ground or water
const ss=(a, b, x)=> {
  const t=Math.min(1, Math.max(0, (x-a)/(b-a)));
  return t*t*(3-2*t)
};
function hs(x, y) {
  let h=(Math.imul(x, 374761393)+Math.imul(y, 668265263))>>>0;
  h=Math.imul(h^(h>>>13), 1274126177)>>>0;
  h=(h^(h>>>16))>>>0;
  return h/4294967295
}

function nz(x, y) {
  const ix=Math.floor(x), iy=Math.floor(y);
  let fx=x-ix, fy=y-iy;
  fx=fx*fx*fx*(fx*(fx*6-15)+10);
  fy=fy*fy*fy*(fy*(fy*6-15)+10);
  const a=hs(ix, iy), b=hs(ix+1, iy), c=hs(ix, iy+1), d=hs(ix+1, iy+1);

function H(x, z) {
  let qx=x*.0045, qz=z*.0045, a=.5, h=0;
  for(let i=0; i<4; i++) {
    h+=a*nz(qx, qz);
    const t=.8*qx-.6*qz;
    qz=(.6*qx+.8*qz)*2.03;
    qx=t*2.03;
    a*=.5
  }
  h=(h-.469)*80+7;
  const r=Math.abs(nz(x*.0025+31, z*.0025+7)-.5);
  const rw=(1-ss(0, .035, r))*(1-ss(8, 22, h));
  return Math.min(h, h+(-3-h)*rw)
}

TEX_DATA.forEach((src, unit) => {
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([128, 128, 128, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.uniform1i(U[['uSand', 'uPeb', 'uGrass', 'uRock'][unit]], unit);
  const img = new Image();
  img.onload = () => {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
  };
  img.src = src;
});
  const $=id=>document.getElementById(id);
  const cam= {
    x:0, z:0, y:40, yaw:.6, pitch:-.15
  };
  let time=0, hour=9.5, maxScale=Math.min(window.devicePixelRatio||1, 2), scale=maxScale*.7, ft=16, fc=0;
  const keys= {
  };
  addEventListener('keydown', e=>keys[e.code]=1);
  addEventListener('keyup', e=>keys[e.code]=0);
  let drag=null;
  cv.addEventListener('pointerdown', e=> {
    drag= {
      x:e.clientX, y:e.clientY
    };
    cv.setPointerCapture(e.pointerId)
  });
  cv.addEventListener('pointermove', e=> {
    if(!drag)return;
    cam.yaw+=(e.clientX-drag.x)*.0045;
    cam.pitch=Math.max(-1.4, Math.min(1.4, cam.pitch+(e.clientY-drag.y)*.0045));
    drag= {
      x:e.clientX, y:e.clientY
    }
  });
  ['pointerup', 'pointercancel'].forEach(n=>cv.addEventListener(n, ()=>drag=null));
  $('tg').onclick=()=>$('pn').classList.toggle('on');
  $('hr').oninput=e=>hour=+e.target.value;
  setTimeout(()=>$('hint').style.opacity=0, 7000);
  function fmt(h) {
    const m=Math.floor(h*60)%1440;
    return String(Math.floor(m/60)).padStart(2, '0')+':'+String(m%60).padStart(2, '0')
  }
  function cross(a, b) {
    return[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]
  }
  function norm(a) {
    const l=Math.hypot(...a);
    return a.map(v=>v/l)
  }
  let last=performance.now();
  function frame(now) {
    const dt=Math.min((now-last)/1000, .1);
    last=now;
    time+=dt;
    ft=ft*.95+dt*1000*.05;
    fc++;
    if($('k4').checked) {
      const cw = cv.clientWidth, ch = cv.clientHeight;
      scale = Math.min(3840 / Math.max(cw, ch), 2160 / Math.min(cw, ch));
    } else if($('mq').checked) scale = maxScale;
    else if(fc%20==0) {
      if(ft>30)scale=Math.max(.5, scale*.93);
      else if(ft<22)scale=Math.min(maxScale, scale*1.03)
    }
    const w=Math.max(2, Math.round(cv.clientWidth*scale)), h=Math.max(2, Math.round(cv.clientHeight*scale));
    if(Math.abs(cv.width-w)>w*.04||Math.abs(cv.height-h)>h*.04||fc==1) {
      cv.width=w;
      cv.height=h
    }
    gl.viewport(0, 0, cv.width, cv.height);
    // time of day
    const sunE=Math.sin((hour-6)/12*Math.PI);
    if($('au').checked) {
      hour=(hour+dt*(sunE<-.1?.5:.11))%24;
      $('hr').value=hour
    }
    $('hv').textContent=fmt(hour);
    // wind
    const ang=.6+.8*Math.sin(time*.05)+.4*Math.sin(time*.13), str=Math.max(.2, .65+.35*Math.sin(time*.21)+.2*Math.sin(time*.7));
    // movement
    const fx=Math.sin(cam.yaw), fz=Math.cos(cam.yaw);
    const mv=(+$('sp').value)+((keys.KeyW||keys.ArrowUp)?25:0)-((keys.KeyS||keys.ArrowDown)?25:0);
    const st=((keys.KeyD||keys.ArrowRight)?-1:0)+((keys.KeyA||keys.ArrowLeft)?1:0);
    cam.x+=(fx*mv-fz*st*25)*dt;
    cam.z+=(fz*mv+fx*st*25)*dt;
    const hg=Math.max(0, H(cam.x, cam.z), H(cam.x+fx*12, cam.z+fz*12), H(cam.x+fx*30, cam.z+fz*30)*.9);
    cam.y+=(hg+(+$('al').value)-cam.y)*Math.min(1, dt*2);
    const gh=Math.max(0, H(cam.x, cam.z));
    if(cam.y<gh+2.5)cam.y=gh+2.5;
    const cp=Math.cos(cam.pitch);
    const F=[fx*cp, Math.sin(cam.pitch), fz*cp], R=norm(cross(F, [0, 1, 0])), Uv=cross(R, F);
    const ph=(hour-6)/12*Math.PI, sun=norm([Math.cos(ph)*.85, Math.sin(ph), .5]);
    gl.uniform2f(U.uRes, cv.width, cv.height);
    gl.uniform2f(U.uWind, Math.cos(ang)*str, Math.sin(ang)*str);
    gl.uniform1f(U.uTime, time);
    gl.uniform3f(U.uCam, cam.x, cam.y, cam.z);
    gl.uniform3fv(U.uF, F);
    gl.uniform3fv(U.uR, R);
    gl.uniform3fv(U.uU, Uv);
    gl.uniform3fv(U.uSun, sun);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame);
}
